<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <!-- YouTube bắt buộc trình nhúng gửi Referer, nếu không sẽ báo lỗi 153 -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Kids Tube</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="logo"><span class="logo-play"></span>Kids Tube</div>
      <div id="tabs"></div>
      <div id="limit-badge"></div>
    </header>
    <main id="grid"></main>
    <div id="status"></div>
  </div>

  <div id="player-screen" class="hidden">
    <div id="player-host"><div id="player"></div></div>
    <div id="player-shield"></div>
    <div id="player-msg"></div>
    <div id="hud">
      <div id="hud-title"></div>
      <div id="hud-meta"></div>
      <div class="bar"><div id="hud-fill"></div></div>
      <div class="hud-row">
        <span id="hud-time"></span>
        <span class="hud-hint">OK: Dừng/Phát &nbsp;·&nbsp; ◀ ▶: Tua 10 giây &nbsp;·&nbsp; ▲ ▼: Video trước/sau &nbsp;·&nbsp; Quay lại: Về danh sách</span>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // Luôn tải config.js mới nhất (tránh TV giữ bản cũ trong bộ nhớ đệm)
    document.write('<script src="js/config.js?t=' + Date.now() + '"><\/script>');
  </script>
  <script src="js/ytdata.js"></script>
  <script src="js/app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
